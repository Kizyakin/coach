services:
  - type: web
    name: chess-coach-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: STOCKFISH_PATH
        value: /usr/games/stockfish
      - key: FRONTEND_ORIGIN
        sync: false
      # DATABASE_URL is intentionally optional. Core chess features do not
      # depend on PostgreSQL, so an expired/missing DB can never take the API down.

  - type: web
    name: chess-coach-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
